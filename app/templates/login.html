{% extends "base.html" %}

{% block title %}Iniciar Sesión | TRIBU{% endblock %}

{% block content %}
<section class="section auth-section">
    <div class="auth-card glass-panel animate-fade">
        <div class="auth-header">
            <span class="auth-brand">TRIBU</span>
            <h2>INICIAR SESIÓN</h2>
            <p>Ingresa a tu cuenta para gestionar tus pedidos y envíos.</p>
        </div>

        {% if error %}
            <div class="alert alert-danger">
                <i class="fa-solid fa-triangle-exclamation"></i> {{ error }}
            </div>
        {% endif %}

        <form action="/auth/login" method="post" class="auth-form">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required placeholder="tuemail@correo.com">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-glow">Entrar a la Tribu</button>
        </form>

        <div class="auth-footer">
            <p>¿Nuevo en la tienda? <a href="/auth/register">Regístrate aquí</a></p>
        </div>
    </div>
</section>
{% endblock %}
