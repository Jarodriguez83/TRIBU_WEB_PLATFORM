{% extends "base.html" %}

{% block title %}Registrarse | TRIBU{% endblock %}

{% block content %}
<section class="section auth-section">
    <div class="auth-card glass-panel register-card animate-fade">
        <div class="auth-header">
            <span class="auth-brand">TRIBU</span>
            <h2>CREAR CUENTA</h2>
            <p>Forma parte de la Tribu y realiza tus compras de forma ágil.</p>
        </div>

        {% if error %}
            <div class="alert alert-danger">
                <i class="fa-solid fa-triangle-exclamation"></i> {{ error }}
            </div>
        {% endif %}

        <form action="/auth/register" method="post" class="auth-form">
            <!-- Datos Personales -->
            <div class="form-group">
                <label for="nombre">Nombre Completo *</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Juan Pérez">
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico *</label>
                <input type="email" id="email" name="email" required placeholder="tuemail@correo.com">
            </div>

            <div class="form-group">
                <label for="password">Contraseña *</label>
                <input type="password" id="password" name="password" required placeholder="Mínimo 6 caracteres" minlength="6">
            </div>

            <!-- Datos de Envío Iniciales (Opcional en registro) -->
            <div class="form-divider"><span>Datos de Envío (Opcional)</span></div>

            <div class="form-row">
                <div class="form-group">
                    <label for="telefono">Teléfono / Celular</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="3001234567">
                </div>
                <div class="form-group">
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion" name="direccion" placeholder="Calle 123 # 45-67">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="departamento">Departamento</label>
                    <input type="text" id="departamento" name="departamento" placeholder="Antioquia">
                </div>
                <div class="form-group">
                    <label for="ciudad">Ciudad</label>
                    <input type="text" id="ciudad" name="ciudad" placeholder="Medellín">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-glow">Registrarme</button>
        </form>

        <div class="auth-footer">
            <p>¿Ya tienes cuenta? <a href="/auth/login">Inicia sesión aquí</a></p>
        </div>
    </div>
</section>
{% endblock %}
